<!DOCTYPE html>
<html lang="en" data-theme="coffee">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sessions — Coffee E-Menu Admin</title>
  <meta name="description" content="Create and manage coffee ordering sessions with shareable links." />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-base-200 min-h-screen" x-data="sessionsApp()" x-init="init()">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-sm sticky top-0 z-50">
    <div class="flex-1">
      <a href="/admin/dashboard.html" class="flex items-center gap-2 px-4">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-primary-content" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21v-2h2V7a1 1 0 011-1h14a1 1 0 011 1v2h2a2 2 0 010 4h-2v5h2v2H2zm16-4V8H6v9h12zm2-3h2V9h-2v5z"/></svg>
        </div>
        <span class="font-semibold text-base-content text-lg" style="font-family:'Playfair Display',serif">Coffee E-Menu</span>
      </a>
    </div>
    <div class="flex-none px-4">
      <button id="logout-btn" @click="logout()" class="btn btn-ghost btn-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Logout
      </button>
    </div>
  </div>

  <div class="flex min-h-[calc(100vh-4rem)]">
    <!-- Sidebar -->
    <aside class="w-64 bg-base-100 shadow-sm hidden md:flex flex-col py-6 px-4 gap-1">
      <a href="/admin/dashboard.html" class="btn btn-ghost btn-sm justify-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Dashboard
      </a>
      <a href="/admin/menu.html" class="btn btn-ghost btn-sm justify-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M8.1 13.34l2.83-2.83L3.91 3.5C2.35 5.06 2.35 7.56 3.91 9.12l4.19 4.22zm6.78-1.81c1.53.71 3.68.21 5.27-1.38 1.91-1.91 2.28-4.65.81-6.12-1.46-1.46-4.2-1.1-6.12.81-1.59 1.59-2.09 3.74-1.38 5.27L3 19.69l1.41 1.41L9 16.5l4.59 4.59 1.41-1.41-4.6-4.59 2.48-2.56z"/></svg>Menu
      </a>
      <a href="/admin/sessions.html" class="btn btn-primary btn-sm justify-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>Sessions
      </a>
      <a href="/admin/orders.html" class="btn btn-ghost btn-sm justify-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Orders
      </a>
    </aside>

    <main class="flex-1 p-6">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl text-base-content">Sessions</h1>
          <p class="text-base-content/50 text-sm mt-1">Create and share ordering sessions</p>
        </div>
        <button id="new-session-btn" @click="showModal = true" class="btn btn-primary btn-sm gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          New Session
        </button>
      </div>

      <!-- Toast -->
      <div x-show="toast.show" x-cloak x-transition class="toast toast-top toast-end z-50">
        <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
          <span x-text="toast.message"></span>
        </div>
      </div>

      <!-- Sessions List -->
      <div x-show="sessions.length === 0" class="text-center py-16 text-base-content/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 mx-auto mb-4 opacity-30" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        <p>No sessions yet. Create your first!</p>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <template x-for="s in sessions" :key="s.id">
          <div class="card bg-base-100 shadow hover:shadow-md transition-shadow">
            <div class="card-body">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h3 class="font-semibold text-base-content" x-text="s.title"></h3>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="badge badge-sm" :class="s.status === 'open' ? 'badge-success' : 'badge-ghost'" x-text="s.status === 'open' ? '🟢 Open' : '⛔ Closed'"></span>
                    <span class="badge badge-sm badge-primary" x-text="s.order_count + ' orders'"></span>
                  </div>
                </div>
                <div class="flex gap-1">
                  <button x-show="s.status === 'open'" @click="closeSession(s)" class="btn btn-xs btn-warning">Close</button>
                  <button x-show="s.status === 'closed'" @click="reopenSession(s)" class="btn btn-xs btn-success">Reopen</button>
                  <button @click="deleteSession(s)" class="btn btn-xs btn-ghost text-error">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                  </button>
                </div>
              </div>

              <div class="text-sm text-base-content/60 mt-2 space-y-1">
                <div class="flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
                  <span>Deadline: <strong x-text="formatDeadline(s.deadline)"></strong></span>
                </div>
                <div class="flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>
                  <span>Created: <strong x-text="formatDate(s.created_at)"></strong></span>
                </div>
              </div>

              <!-- Share Link -->
              <div class="mt-3 bg-base-200 rounded-lg p-3">
                <p class="text-xs text-base-content/50 mb-1 font-medium">Shareable Order Link</p>
                <div class="flex items-center gap-2">
                  <code class="text-xs text-primary flex-1 truncate" x-text="getOrderLink(s.token)"></code>
                  <button @click="copyLink(s.token)" class="btn btn-xs btn-ghost gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copy
                  </button>
                  <a :href="getOrderLink(s.token)" target="_blank" class="btn btn-xs btn-ghost gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                    Open
                  </a>
                </div>
              </div>

              <div class="card-actions mt-2">
                <a :href="'/admin/orders.html?session=' + s.id" class="btn btn-sm btn-outline w-full">View Orders</a>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>
  </div>

  <!-- New Session Modal -->
  <dialog id="session-modal" class="modal" :class="{ 'modal-open': showModal }">
    <div class="modal-box max-w-md">
      <h3 class="text-xl mb-6">Create New Session</h3>
      <form @submit.prevent="createSession" class="flex flex-col gap-4">
        <div class="form-control">
          <label class="label pb-1"><span class="label-text font-medium">Session Title *</span></label>
          <input id="session-title" type="text" x-model="form.title" class="input input-bordered" required
            placeholder="e.g. Friday Morning Order" />
        </div>
        <div class="form-control">
          <label class="label pb-1"><span class="label-text font-medium">Order Deadline *</span></label>
          <input id="session-deadline" type="datetime-local" x-model="form.deadline" class="input input-bordered" required :min="minDatetime()" />
          <label class="label"><span class="label-alt text-base-content/50">Orders will stop after this time</span></label>
        </div>
        <div class="modal-action">
          <button type="button" @click="showModal = false" class="btn btn-ghost">Cancel</button>
          <button id="create-session-btn" type="submit" class="btn btn-primary" :class="{ 'loading': creating }" :disabled="creating">
            <span x-show="!creating">Create Session</span>
            <span x-show="creating">Creating...</span>
          </button>
        </div>
      </form>
    </div>
    <div class="modal-backdrop" @click="showModal = false"></div>
  </dialog>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script>
    function sessionsApp() {
      return {
        sessions: [],
        showModal: false,
        creating: false,
        form: { title: '', deadline: '' },
        toast: { show: false, message: '', type: 'success' },

        async init() {
          const auth = await fetch('/api/auth/me').then(r => r.json());
          if (!auth.loggedIn) { window.location.href = '/admin/login.html'; return; }
          await this.loadSessions();
        },
        async loadSessions() {
          this.sessions = await fetch('/api/sessions').then(r => r.json());
        },
        async createSession() {
          this.creating = true;
          const res = await fetch('/api/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.form)
          });
          const data = await res.json();
          this.creating = false;
          if (!res.ok) { this.showToast(data.error, 'error'); return; }
          this.showModal = false;
          this.form = { title: '', deadline: '' };
          this.showToast('Session created! Share the link below.', 'success');
          await this.loadSessions();
        },
        async closeSession(s) {
          if (!confirm('Close this session? Customers will no longer be able to order.')) return;
          await fetch(`/api/sessions/${s.id}/close`, { method: 'PATCH' });
          this.showToast('Session closed.', 'success');
          await this.loadSessions();
        },
        async reopenSession(s) {
          await fetch(`/api/sessions/${s.id}/open`, { method: 'PATCH' });
          this.showToast('Session reopened.', 'success');
          await this.loadSessions();
        },
        async deleteSession(s) {
          if (!confirm(`Delete session "${s.title}" and all its orders?`)) return;
          await fetch(`/api/sessions/${s.id}`, { method: 'DELETE' });
          this.showToast('Session deleted.', 'success');
          await this.loadSessions();
        },
        getOrderLink(token) {
          return `${window.location.origin}/order?token=${token}`;
        },
        async copyLink(token) {
          await navigator.clipboard.writeText(this.getOrderLink(token));
          this.showToast('Link copied to clipboard!', 'success');
        },
        minDatetime() {
          const d = new Date();
          d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          return d.toISOString().slice(0, 16);
        },
        formatDate(dt) {
          // SQLite datetime('now') is UTC with no 'Z' marker — append it so JS parses correctly
          const utc = new Date(dt.replace(' ', 'T') + 'Z');
          return utc.toLocaleString('km-KH', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Phnom_Penh' });
        },
        formatDeadline(dt) {
          // Deadline comes from datetime-local input — already local time (GMT+7), parse as-is
          return new Date(dt).toLocaleString('km-KH', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Phnom_Penh' });
        },
        showToast(message, type = 'success') {
          this.toast = { show: true, message, type };
          setTimeout(() => this.toast.show = false, 3500);
        },
        async logout() {
          await fetch('/api/auth/logout', { method: 'POST' });
          window.location.href = '/admin/login.html';
        }
      }
    }
  </script>
</body>
</html>
